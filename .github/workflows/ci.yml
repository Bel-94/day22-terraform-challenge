name: Infrastructure CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_CLI_ARGS: "-no-color"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Unit tests
        run: terraform test

  plan:
    runs-on: ubuntu-latest
    needs: validate
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init

      - name: Plan
        id: plan
        run: terraform plan -no-color

      - name: Save plan summary
        run: |
          echo "Terraform Cloud Run URL:" > plan-summary.txt
          echo "https://app.terraform.io/app/Bel_terra_acc/workspaces/day22-integrated/runs" >> plan-summary.txt
          echo "" >> plan-summary.txt
          echo "Plan executed successfully in CI" >> plan-summary.txt

      - name: Upload plan summary
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: plan-summary.txt
